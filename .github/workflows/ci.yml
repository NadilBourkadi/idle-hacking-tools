name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The toolkit itself is zero-dependency; ruff is dev-only tooling.
      - run: pip install ruff
      - run: ruff check scripts tests
      - run: python -m unittest discover tests -v
      # The library must import cleanly with an empty data tree (fresh clone)
      - run: mkdir -p data && python -c "import sys; sys.path.insert(0, 'scripts'); import ihlib, experiments"
